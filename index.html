<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Order Cart</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#ffdbe8;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      width:380px;
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#ff4f87;
    }

    .food-card{
      background:#fff0f5;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
    }

    .food-name{
      font-size:20px;
      font-weight:bold;
      color:#444;
    }

    .price{
      margin:8px 0;
      color:#ff4f87;
    }

    button{
      background:#4da6ff;
      border:none;
      color:white;
      padding:10px 18px;
      border-radius:10px;
      cursor:pointer;
      font-size:15px;
      transition:0.3s;
    }

    button:hover{
      background:#1f8fff;
    }

    .cart{
      margin-top:20px;
      background:#fff0f5;
      padding:15px;
      border-radius:15px;
    }

    .cart h2{
      color:#ff4f87;
      margin-top:0;
    }

    #cart-items{
      list-style:none;
      padding:0;
    }

    #cart-items li{
      margin-bottom:8px;
      color:#444;
    }

    #total{
      margin-top:15px;
      font-size:20px;
      font-weight:bold;
      color:#ff4f87;
    }

    .checkout{
      width:100%;
      margin-top:15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Food Order 🍔</h1>

    <div class="food-card">
      <div class="food-name">Burger</div>
      <div class="price">RM 8</div>
      <button onclick="addToCart('Burger',8)">
        Add to Cart
      </button>
    </div>

    <div class="food-card">
      <div class="food-name">Pizza</div>
      <div class="price">RM 12</div>
      <button onclick="addToCart('Pizza',12)">
        Add to Cart
      </button>
    </div>

    <div class="food-card">
      <div class="food-name">Fries</div>
      <div class="price">RM 5</div>
      <button onclick="addToCart('Fries',5)">
        Add to Cart
      </button>
    </div>

    <div class="cart">
      <h2>🛒 Cart</h2>

      <ul id="cart-items"></ul>

      <div id="total">
        Total: RM 0
      </div>

      <button class="checkout" onclick="checkout()">
        Checkout
      </button>
    </div>

  </div>

  <script>
    let total = 0;

    function addToCart(food, price){

      let li = document.createElement("li");
      li.innerText = food + " - RM " + price;

      document.getElementById("cart-items").appendChild(li);

      total += price;

      document.getElementById("total").innerText =
      "Total: RM " + total;
    }

    function checkout(){

      alert("Order Successful!");

      document.getElementById("cart-items").innerHTML = "";

      total = 0;

      document.getElementById("total").innerText =
      "Total: RM 0";
    }
  </script>

</body>
</html>
